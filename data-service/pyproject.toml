
[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = [
  "external",
  ".venv",
  "venv",
  "__pycache__",
  ".pytest_cache",
  ".test-cache",
  ".ml-workdir",
  ".ml-data",
]

[tool.mypy]
python_version = "3.13"
exclude = "^(external|\\.venv|venv|__pycache__|\\.pytest_cache|\\.test-cache|\\.ml-workdir|\\.ml-data)(/|$)"
ignore_missing_imports = true
follow_imports = "silent"
show_error_codes = true
warn_unused_configs = true