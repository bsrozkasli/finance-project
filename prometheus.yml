global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'spring-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['host.docker.internal:8080']

  - job_name: 'python-data-service'
    metrics_path: '/metrics'
    scrape_interval: 5s
    static_configs:
      - targets: ['data-service:8000']

  - job_name: 'postgres'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'prometheus'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'grafana'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['grafana:3000']