name: pages

# Publishes the frontend to GitHub Pages from main only (a reviewed PR is the
# only way code reaches main). No backend is attached by default, so API calls
# resolve to a path that answers 404 and every data panel shows its explicit
# unavailable state. Set the repository variable PAGES_API_BASE_URL to point a
# deployment at a real backend (must be https and allow CORS for the Pages origin).

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        working-directory: frontend
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_BASE_URL: ${{ vars.PAGES_API_BASE_URL || format('/{0}/no-backend/api/v1', github.event.repository.name) }}
          VITE_DEMO_BANNER: ${{ vars.PAGES_API_BASE_URL == '' && 'true' || 'false' }}
        run: npm run build

      - name: SPA fallback for deep links
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
